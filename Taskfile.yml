# https://taskfile.dev

version: '3'

tasks:

  default:
    cmds:
      - task -l
    silent: true

  init:
    desc: Initialises the project
    sources:
      - mise.toml
    generates:
      - mise.lock
    cmds:
      - mise install

  test:
    desc: Test the project
    deps:
      - init
    vars:
      TMPDIR:
        sh: mktemp -d
    cmds:
      - defer: rm -rf {{ .TMPDIR }}
      - boilerplate --template-url . --output-folder {{ .TMPDIR }}
